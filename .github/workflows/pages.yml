name: Web (GitHub Pages)

# Plume in the browser: the WebAssembly build of apps/wordcraft-web, published as a static site
# at https://<owner>.github.io/<repo>/ on every push to main (and on demand). One-time setting:
# Settings › Pages › Build and deployment › Source: GitHub Actions. Hosting notes:
# packaging/web/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'apps/wordcraft-web/**'
      - 'crates/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14
  # Colour emoji in the browser, which has no system emoji font (Noto Color Emoji, OFL-1.1;
  # ATTRIBUTION.md). Not a file in this repository: downloaded here and embedded by
  # crates/fonts/build.rs through PLUME_EMOJI_FONT.
  NOTO_EMOJI_REF: v2.047

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pages
      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin
          trunk --version
      - name: Download the emoji font
        run: |
          font="$RUNNER_TEMP/Noto-COLRv1.ttf"
          curl -sSfL -o "$font" "https://github.com/googlefonts/noto-emoji/raw/${NOTO_EMOJI_REF}/fonts/Noto-COLRv1.ttf" \
            || curl -sSfL -o "$font" "https://github.com/googlefonts/noto-emoji/raw/main/fonts/Noto-COLRv1.ttf"
          ls -l "$font"
          echo "PLUME_EMOJI_FONT=$font" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/wordcraft-web
        run: trunk build --release --locked
      - name: Check the site works under a sub-path
        run: |
          # Relative URLs only (public_url = "./"): the site is served under /<repo>/.
          if grep -Eq '(src|href)="/[^/]' dist/web/index.html; then
            echo "::error::dist/web/index.html has root-absolute URLs"
            exit 1
          fi
          touch dist/web/.nojekyll
          ls -lh dist/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
