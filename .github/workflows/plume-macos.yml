# Plume is developed and tested on macOS first: every push runs the whole quality gate there
# (format, clippy, all tests, layering, asset attribution). The cloud sessions that write the
# code run Linux, so this is where the Mac-only behaviour (Metal rendering, the native file
# dialogs, the system fonts) gets checked.
name: Plume (macOS)

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plume-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (macOS, Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Layers and assets
        run: |
          cargo run -q -p xtask -- layers
          cargo run -q -p xtask -- assets
